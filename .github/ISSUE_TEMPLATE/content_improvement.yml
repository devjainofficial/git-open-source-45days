name: "Content improvement"
description: "Suggest an improvement or add new material"
title: "[Improve]: <short description>"
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: "What should we change or add? Why?"
      placeholder: "Add a diagram for Day 12; Clarify rebase vs merge, etc."
    validations:
      required: true
  - type: input
    id: day
    attributes:
      label: Day number (if applicable)
      placeholder: "e.g., 12"